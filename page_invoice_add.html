    <style>
        body { font-family: Tahoma, Arial, sans-serif; background: #f4f6fa; margin: 0; padding: 0; }
        .dashboard-container { display: flex; min-height: 100vh; direction: ltr; }
        .sidebar { width: 230px; background: #222e3c; color: #fff; padding: 0; display: flex; flex-direction: column; transition: right 0.3s; z-index: 1000; direction: ltr; position: fixed; top: 70px; left: 0; height: calc(100vh - 70px); overflow-y: auto; }
        .sidebar h2 { text-align: left; margin: 24px 0 14px 0; font-size: 1.2em; letter-spacing: 1px; padding-left:16px; }
        .sidebar ul { list-style: none; padding: 0; margin: 0; text-align: left; }
        .sidebar ul li { padding: 12px 24px; border-bottom: 1px solid #2d3a4a; cursor: pointer; display: block; font-size: 0.95em; transition: background 0.2s; }
        .sidebar ul li:hover { background: #1a2330; }
        .sidebar ul li i { float: left; margin-right: 12px; margin-left: 0; font-size: 1.2em; }
        .sidebar ul li:after { content: ""; display: block; clear: both; }
        .sidebar ul li ul { display: none; padding-left: 54px; margin: 0; }
        .sidebar ul li ul li { padding: 6px 0; font-size: 0.95em; }
        .sidebar ul li ul li a { padding-left: 0 !important; display: block; }
        .sidebar ul li .fa-chevron-down { margin-left: 7px; }
        .main-content { flex: 1; padding: 90px 40px 40px 40px; }
        .mobile-sidebar-toggle {
            display: none;
            position: absolute;
            left: 20px;
            top: 18px;
            background: none;
            border: none;
            font-size: 2em;
            color: #f6c23e;
            z-index: 1100;
            cursor: pointer;
        }
        .sidebar.mobile-hidden, .sidebar.mobile-visible { width: 230px; transition: right 0.3s; }
        @media (min-width: 901px) {
            /* Desktop: keep sidebar fixed and push main content to the right */
            .sidebar { position: fixed !important; left: 0 !important; top: 70px !important; height: calc(100vh - 70px); box-shadow: none !important; }
            .main-content { margin-left: 230px; padding-top: 70px; }
            .mobile-sidebar-toggle { display: none !important; }
        }
        @media (max-width: 900px) {
            .sidebar {
                width: 230px;
                position: fixed;
                left: -260px;
                top: 70px;
                height: calc(100vh - 70px);
                flex-direction: column;
                overflow-y: auto;
                z-index: 1001;
                display: block;
                transition: left 0.3s;
            }
            .sidebar.mobile-hidden {
                left: -260px !important;
                display: block !important;
            }
            .sidebar.mobile-visible {
                left: 0 !important;
                display: block !important;

        @media (max-width: 700px) {
            .sidebar {
                width: 230px;
                position: fixed;

                flex-direction: column;

        /* Mobile-specific: force LTR topbar and hamburger on the left */
        @media (max-width: 700px) {
                .topbar { direction: ltr !important; padding-left: 56px !important; }
                /* Keep the hamburger absolutely positioned but vertically centered
                    and leave left padding on the topbar so the logo/content don't sit under it. */
                .mobile-sidebar-toggle { display: block !important; position: absolute !important; left: 12px !important; top: 50% !important; transform: translateY(-50%) !important; right: auto !important; }
            /* Ensure sidebar slides from the LEFT on mobile regardless of page RTL */
            .sidebar { left: -260px !important; right: auto !important; }
            .sidebar.mobile-visible { left: 0 !important; right: auto !important; }
            /* Prevent body scroll when sidebar open on mobile */
            body.sidebar-open { overflow: hidden; }
                /* Shift the workshop logo slightly right on mobile so it sits beside the hamburger.
                    Reduced from 5ch to 2ch to visually move the logo left closer to the hamburger. */
                .topbar .workshop-logo { margin-left: 2ch !important; margin-right: 1ch !important; }
            /* Mobile: shift the search (magnifier) slightly left by ~2 spaces */
            #topbar-search { margin-left: -2ch !important; }
                /* Make the search input expand when explicitly opened; keep it hidden by default on mobile
                    so only the magnifier is visible. The toggle button will reveal the input. */
                #global-search-input { display: none !important; width: calc(100% - 56px) !important; }
            #global-search-results {
                position: fixed !important;
                top: 70px !important;
                left: 0 !important;
                right: 0 !important;
                z-index: 1200 !important;
                background: #fff !important;

                overflow: auto !important;

            /* Removed small duplicate .topbar override (would have forced RTL). */

        /* Responsive table helper: keeps wide tables from expanding the page
           and enables touch-friendly horizontal scrolling inside a container. */
        .table-responsive {
            width: 100%;
            box-sizing: border-box;
            overflow-x: auto;
            overflow-y: visible;
            -webkit-overflow-scrolling: touch;
        }
        .table-responsive > table {
            /* allow table to size to content but not force page overflow */
            width: max-content;
            min-width: 100%;
            border-collapse: collapse;
        }
        /* iPad Pro / Tablets - finer tuning for 11" and 12.9" iPad resolutions */
        /* Targets common iPad widths: 1024, 1112, 1194, 1366 */
        @media (min-width: 768px) and (max-width: 1366px) {

            .sidebar{
                width: 210px;
            }

        /* Dashboard cards layout tweak for tablets */
        @media (max-width: 1366px){
            .cards{
                grid-template-columns: repeat(3, 1fr);

        }
        /* Fix action buttons on tablet: wrap and resize so they don't overflow bottom */
        @media (max-width: 1024px){

            .form-actions,
            .invoice-actions,
            .action-buttons{
                display:flex;
                flex-wrap:wrap;
                gap:10px;
                align-items:center;
                /* Ensure these action containers remain in normal document flow
                   (not fixed/absolute) so they don't stick outside the page viewport
                   on tablet/phone emulation. The !important guards avoid overrides
                   from page-specific inline styles. */
                position: static !important;
            }

            .form-actions button,
            .invoice-actions button,
            .action-buttons button{
                flex:1 1 45%;
                min-width:150px;
            }

            .total-amount{
                width:100%;

            /* Provide extra bottom padding so any sticky/absolute action bars

            <script>
            document.addEventListener('DOMContentLoaded', function() {
                var sidebar = document.getElementById('sidebarMenu');
                var toggle = document.getElementById('sidebarToggle');
                var toggleIcon = document.getElementById('sidebarToggleIcon');
                var submenus = [
                    {section: 'services-section', submenu: 'brands-submenu'},
                    {section: 'clients-section', submenu: 'clients-submenu'},
                    {section: 'purchases-section', submenu: 'purchases-submenu'},
                    {section: 'cars-section', submenu: 'cars-submenu'},
                    {section: 'invoices-section', submenu: 'invoices-submenu'}
                ];
                function openSidebar() {
                    sidebar.classList.remove('mobile-hidden');
                    sidebar.classList.add('mobile-visible');
                    document.body.classList.add('sidebar-open');
                    if(toggleIcon) {
                        toggleIcon.classList.remove('fa-bars');
                        toggleIcon.classList.add('fa-times');
                    }
                }
                function closeSidebar() {
                    sidebar.classList.remove('mobile-visible');
                    sidebar.classList.add('mobile-hidden');
                    document.body.classList.remove('sidebar-open');
                    closeAllSubmenus();
                    if(toggleIcon) {
                        toggleIcon.classList.remove('fa-times');
                        toggleIcon.classList.add('fa-bars');
                    }
                }
                function closeAllSubmenus() {
                    submenus.forEach(function(item){
                        var submenu = document.getElementById(item.submenu);
                        if(submenu) submenu.style.display = 'none';
                    });
                }
                if(toggle && sidebar) {
                    toggle.onclick = function(e) {
                        e.stopPropagation();
                        if(sidebar.classList.contains('mobile-visible')) {
                            closeSidebar();
                        } else {
                            openSidebar();
                        }
                    };
                }
                if (sidebar) sidebar.onclick = function(e) { e.stopPropagation(); };
                // Restore last-open section from localStorage (keeps submenu open across navigation)
                var lastOpenSection = null;
                try { lastOpenSection = localStorage.getItem('openSidebarSection'); } catch(ex) { lastOpenSection = null; }
                submenus.forEach(function(item){
                    var section = document.getElementById(item.section);
                    var submenu = document.getElementById(item.submenu);
                    if(section && submenu) {
                        // If template or localStorage says this submenu should be open, ensure it's visible
                        if((lastOpenSection && lastOpenSection === item.section) || submenu.style.display === 'block') {
                            submenu.style.display = 'block';
                        }
                        section.onclick = function(e) {
                            // only react when the clicked <li> is this section itself (ignore clicks on other list items)
                            var clickedLi = e.target && e.target.closest ? e.target.closest('li') : null;
                            if (!clickedLi || clickedLi.id !== item.section) return;
                            // ignore clicks on links inside the section (let links navigate)
                            if (e.target && e.target.closest && e.target.closest('a')) return;
                            e.stopPropagation();
                            // toggle this submenu while closing others
                            var willBeOpen = (submenu.style.display !== 'block');
                            closeAllSubmenus();
                            submenu.style.display = willBeOpen ? 'block' : 'none';
                            try {
                                if(willBeOpen) localStorage.setItem('openSidebarSection', item.section); else localStorage.removeItem('openSidebarSection');
                            } catch(ex) {}
                        };
                        submenu.onclick = function(e) { e.stopPropagation(); };
                    }
                });
                document.body.onclick = function() {
                    if(window.innerWidth <= 900) {
                        closeSidebar();
                    } else {
                        closeAllSubmenus();
                    }
                };
                // --- Global topbar search logic ---
                (function(){
                    const toggle = document.getElementById('global-search-toggle');
                    const input = document.getElementById('global-search-input');
                    const results = document.getElementById('global-search-results');
                    const loading = document.getElementById('global-search-loading');
                    const empty = document.getElementById('global-search-empty');
                    const groups = document.getElementById('global-search-groups');
                    const defaultsWrap = document.querySelectorAll('.search-default-wrap');
                    const defaults = document.getElementById('global-search-defaults');
                    if(!toggle || !input || !results) return;
                    let open = false;
                    let debounceTimer = null;
                    toggle.addEventListener('click', function(e){
                        e.stopPropagation();
                        open = !open;
                        if(open) {
                            input.style.display = 'block';
                            input.focus();
                            results.style.display = 'block';
                            // if input empty show default categories
                            if(!input.value.trim()) {
                                if(defaults) defaults.style.display = 'block';
                                if(groups) groups.style.display = 'none';
                                if(loading) loading.style.display = 'none';
                                if(empty) empty.style.display = 'none';
                            }
                        } else {
                            input.value = '';
                            input.style.display = 'none';
                            results.style.display = 'none';
                            if(defaults) defaults.style.display = 'none';
                        }
                    });
                    document.addEventListener('click', function(ev){
                        if(!ev.target.closest('#topbar-search')) {
                            input.style.display = 'none'; results.style.display = 'none'; open=false;
                        }
                    });
                    input.addEventListener('keydown', function(e){
                        if(e.key === 'Escape') { input.value=''; input.blur(); results.style.display='none'; }
                    });
                    input.addEventListener('input', function(e){
                        const q = input.value.trim();
                        clearTimeout(debounceTimer);
                        if(!q) {
                            // show default categories when query is empty
                            if(defaults) defaults.style.display = 'block';
                            if(groups) groups.style.display='none';
                            if(empty) empty.style.display='none';
                            if(loading) loading.style.display='none';
                            return;
                        }
                        debounceTimer = setTimeout(function(){
                            // show loading
                            loading.style.display='block'; empty.style.display='none'; groups.style.display='none';
                            // fetch results from API (implement server-side later)
                            window.fetchJson('/global-search/?q=' + encodeURIComponent(q))
                                .then(data => {
                                    loading.style.display='none';
                                    // expected data: { customers: [...], items: [...], quotes: [...], invoices: [...], vendors: [...] }
                                    const keys = ['customers','items','quotes','invoices','vendors'];
                                    groups.innerHTML = '';
                                    let any = false;
                                    keys.forEach(function(key){
                                        const arr = data[key] || [];
                                        if(arr.length) {
                                            any = true;
                                            const div = document.createElement('div');
                                            div.style.marginBottom = '8px';
                                            const title = document.createElement('div');
                                            title.style.fontWeight='bold'; title.style.marginBottom='6px'; title.textContent = key.charAt(0).toUpperCase() + key.slice(1);
                                            div.appendChild(title);
                                            arr.slice(0,6).forEach(function(item){
                                                const a = document.createElement('a');
                                                a.href = item.url || '#';
                                                a.style.display='block'; a.style.padding='6px 8px'; a.style.borderRadius='6px'; a.style.color='#333'; a.style.textDecoration='none';
                                                a.onmouseenter = function(){ a.style.background='#f6f7fb'; };
                                                a.onmouseleave = function(){ a.style.background='transparent'; };
                                                a.textContent = item.label || item.name || item.title || item.id;
                                                div.appendChild(a);
                                            });
                                            groups.appendChild(div);
                                        }
                                    });
                                    if(!any) { empty.style.display='block'; groups.style.display='none'; } else { groups.style.display='block'; empty.style.display='none'; }
                                })
                                .catch(function(){ loading.style.display='none'; empty.style.display='block'; groups.style.display='none'; });
                        }, 300);
                    });
                    // --- category selection and enter-key behavior ---
                    let currentCategory = null; // one of: customers, items, quotes, invoices, vendors
                    function setCategory(cat) {
                        currentCategory = cat;
                        // update placeholder per category
                        const placeholders = {
                            customers: 'Search by car number, phone or customer name',
                            items: 'Search items by name or SKU',
                            quotes: 'Search quotes by number or customer',
                            invoices: 'Enter invoice number',
                            vendors: 'Search vendors by name or phone'
                        };
                        input.placeholder = placeholders[cat] || 'Search...';
                        // highlight selected default
                        document.querySelectorAll('.search-default').forEach(function(el){ el.style.background = '#f6f7fb'; });
                        const sel = document.querySelector('.search-default[data-type="' + cat + '"]'); if(sel) sel.style.background = '#e8f0ff';
                    }
                    // wire default category clicks and hover-plus visibility
                    defaultsWrap.forEach(function(wrap){
                        const a = wrap.querySelector('.search-default');
                        const plus = wrap.querySelector('.search-default-plus');
                        if(plus) {
                            wrap.addEventListener('mouseenter', function(){ plus.style.display = 'flex'; });
                            wrap.addEventListener('mouseleave', function(){ plus.style.display = 'none'; });
                        }
                        if(a) {
                            a.addEventListener('click', function(ev){
                                ev.preventDefault();
                                const cat = a.getAttribute('data-type');
                                setCategory(cat);
                                // build a small category menu with quick links
                                groups.innerHTML = '';
                                const div = document.createElement('div');
                                div.style.display = 'flex'; div.style.flexDirection='column'; div.style.gap='6px';
                                const openLink = document.createElement('a'); openLink.href = a.getAttribute('data-url') || '#'; openLink.textContent = 'Open ' + (cat.charAt(0).toUpperCase() + cat.slice(1)); openLink.style.padding='8px 10px'; openLink.style.borderRadius='6px'; openLink.style.background='#fff'; openLink.style.border='1px solid #eee'; openLink.style.color='#007bff'; openLink.style.textDecoration='none';
                                div.appendChild(openLink);
                                // create link (if known)
                                const createMap = { customers: '/clients/add/', items: '/inventory/add/', quotes: '/quotes/add/', invoices: '/invoices/add/', vendors: '/suppliers/add/' };
                                if(createMap[cat]){
                                    const createLink = document.createElement('a'); createLink.href = createMap[cat]; createLink.textContent = 'Create new'; createLink.style.padding='8px 10px'; createLink.style.borderRadius='6px'; createLink.style.background='#007bff'; createLink.style.color='#fff'; createLink.style.textDecoration='none'; createLink.style.display='inline-block';
                                    div.appendChild(createLink);
                                }
                                groups.appendChild(div);
                                // show groups and hide defaults
                                if(defaults) defaults.style.display='none';
                                groups.style.display='block';
                                empty.style.display='none'; loading.style.display='none'; results.style.display='block';
                                // ensure input visible and focused
                                input.style.display = 'block'; input.focus();
                            });
                        }
                    });
                    // Enter key: navigate according to currentCategory or perform generic global-search
                    input.addEventListener('keydown', function(e){
                        if(e.key === 'Enter') {
                            e.preventDefault();
                            const q = input.value.trim();
                            if(!q) return;
                            const map = {
                                customers: function(q){ return '/clients/?q=' + encodeURIComponent(q); },
                                items: function(q){ return '/inventory/?q=' + encodeURIComponent(q); },
                                quotes: function(q){ return '/quotes/?q=' + encodeURIComponent(q); },
                                invoices: function(q){
                                    // if numeric, try direct invoice id
                                    if(/^\d+$/.test(q)) return '/invoices/' + q + '/';

                        }

document.addEventListener('click', function (e) {
    const form = e.target.closest('.booking-maintenance-form');
    if (!form) return;

    // لو ضغط على رابط (الهاتف) لا نرسل الفورم
    if (e.target.tagName.toLowerCase() === 'a') {
        return;
    }

    e.preventDefault();

    // جلب CSRF
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.startsWith(name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    let csrfInput = form.querySelector('input[name="csrfmiddlewaretoken"]');
    if (!csrfInput) {
        csrfInput = document.createElement('input');
        csrfInput.type = 'hidden';
        csrfInput.name = 'csrfmiddlewaretoken';
        form.appendChild(csrfInput);
    }
    csrfInput.value = getCookie('csrftoken');

    form.submit();
});
</script>
<!-- Global safe JSON fetch helper: returns parsed JSON or throws with .text for debugging -->
<script>
window.fetchJson = function(url, opts){
    opts = opts || {};
    if(!('credentials' in opts)) opts.credentials = 'same-origin';
    return fetch(url, opts).then(function(resp){
        var ct = (resp.headers.get('content-type')||'').toLowerCase();
        if(!resp.ok){
            return resp.text().then(function(txt){
                try{ console.error('fetchJson HTTP error', { url: url, status: resp.status, text: txt }); }catch(e){}
                var err = new Error('HTTP '+resp.status+' fetching '+url);
                err.status = resp.status; err.url = resp.url; err.text = txt; throw err;
            });
        }
        if(ct.indexOf('application/json') === -1){
            return resp.text().then(function(txt){
                try{ console.error('fetchJson expected JSON but got', { url: url, status: resp.status, text: txt }); }catch(e){}
                var err = new Error('Expected JSON response from '+url);
                err.status = resp.status; err.url = resp.url; err.text = txt; throw err;
            });
        }
        // parse JSON safely: if server claims JSON but returns HTML or invalid JSON,
        // capture the raw text to aid debugging instead of letting a SyntaxError
        // escape as an uncaught exception during parsing.
        return resp.text().then(function(txt){
            try{
                return JSON.parse(txt);
            }catch(parseErr){
                try{ console.error('fetchJson invalid JSON', { url: url, status: resp.status, text: txt, parseError: parseErr }); }catch(e){}
                var err = new Error('Invalid JSON response from '+url);
                err.status = resp.status; err.url = resp.url; err.text = txt; err.parseError = parseErr; throw err;
            }
        });
    });
};
</script>
