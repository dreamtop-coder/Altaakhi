{% extends 'base.html' %}
{% block content %}
<div style="max-width:700px;margin:0;padding:20px;direction:ltr;">
  <h2 style="text-align:left;color:#1976d2;margin-bottom:12px;">{% if creating %}Create User{% else %}Edit User{% endif %}</h2>
  <form method="post" style="background:#fff;padding:12px;border:1px solid #eee;border-radius:6px;">
    {% csrf_token %}
    <div style="display:flex;flex-direction:column;gap:8px;">
      {% for field in form.visible_fields %}
        <label style="font-weight:600;color:#444;">{{ field.label_tag }}
          <div>{{ field }}</div>
          {% if field.help_text %}<small style="color:#888">{{ field.help_text }}</small>{% endif %}
          {% for err in field.errors %}<div style="color:#c00">{{ err }}</div>{% endfor %}
        </label>
      {% endfor %}
    </div>
    <div style="margin-top:12px;display:flex;gap:8px;">
      <button type="submit" style="background:#1976d2;color:#fff;padding:8px 14px;border-radius:6px;border:none;font-weight:700;">Save</button>
      <a href="{% url 'users_list' %}" style="background:#fff;border:1px solid #ddd;color:#333;padding:8px 12px;border-radius:6px;text-decoration:none;">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
