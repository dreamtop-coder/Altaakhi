{% extends 'base.html' %}
{% block content %}
<div style="max-width:700px;margin:0 auto;padding:20px;">
    <h2>Edit Recurring Expense</h2>
    <form method="post">
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
        <div style="margin-top:12px;"><button type="submit" style="background:#1976d2;color:#fff;padding:8px 12px;border-radius:6px;border:none;">Save</button></div>
    </form>
</div>
{% endblock %}
