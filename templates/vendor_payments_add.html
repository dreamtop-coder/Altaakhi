{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/components.css' %}">
<style>
/* reuse payments_add styles */
.customer-selector { display:flex;align-items:center;gap:8px; border:0; background:transparent; padding:0; border-radius:8px; justify-content:flex-start; position:relative; z-index:220; }
#customer-suggestions { position: relative; direction: rtl; width:100%; }
#customer-suggestions div[role="listbox"] { max-height: 400px; overflow-y: auto; }
.customer-selector input { border:0 !important; background:transparent !important; padding:6px 8px; padding-right:96px; }
.customer-selector #customer-suggest-toggle { position:absolute; right:48px; top:0; height:100%; width:36px; display:flex; align-items:center; justify-content:center; padding:0; border-radius:6px; background:transparent; border:0; cursor:pointer; font-size:16px; z-index:230; }
.customer-selector #customer-search-btn { position:absolute; right:8px; top:50%; transform:translateY(-50%); padding:6px 8px; border-radius:6px; z-index:230; }
.customer-selector { display:flex;align-items:center;gap:8px;border:1px solid #e6e6e6;background:transparent;padding:8px;border-radius:8px; justify-content:flex-start; position:relative; z-index:220; }
.customer-selector input { border:0;background:transparent;padding:6px 8px; padding-right:96px; }
.customer-selector #customer-suggest-toggle { position:absolute; right:48px; top:0; height:100%; width:36px; display:flex; align-items:center; justify-content:center; padding:0; border-radius:6px; background:transparent; border:0; cursor:pointer; font-size:16px; z-index:230; }
.customer-selector #customer-search-btn { position:absolute; right:8px; top:50%; transform:translateY(-50%); padding:6px 8px; border-radius:6px; z-index:230; }
.customer-selector button { pointer-events:auto; }
.small-muted { color:#6b7280; font-size:13px; }
label.record-label{ display:block; font-weight:600; margin-bottom:6px; color:#1f2937; }
input[type="text"], input[type="date"], input[type="number"], select{ width:100%; padding:8px; border:1px solid #e6e6ef; border-radius:6px; background:transparent !important; box-sizing:border-box; }
#amount-received-container input{ padding-left:44px; }
.payments-panel { background:transparent !important; padding:16px; border-radius:6px; }
input[type="text"], input[type="date"], input[type="number"], select{ background:transparent !important; }

/* Ensure caret and magnifier sit above the input so they receive clicks */
.customer-selector #customer-suggest-toggle,
.customer-selector #customer-search-btn {
    z-index: 9999 !important;
    pointer-events: auto !important;
    /* match inline sizing used in markup for consistent layout */
    right: 56px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    height: 32px !important;
    width: 32px !important;
}
.customer-selector #customer-search-btn { right: 12px !important; width: auto !important; }

/* Make sure the input sits visually below the buttons */
.customer-selector input#customer-search { z-index: 1000 !important; }
</style>
<div style="max-width:980px;margin:18px 0 18px 18px;padding:18px;background:transparent;border-radius:10px;">
    <h2 style="color:#1976d2;margin-bottom:12px;">Record Payment</h2>
    <div class="payments-panel" style="margin-bottom:12px;">
        <div class="form-grid" style="width:100%;display:grid;grid-template-columns:220px 1fr;row-gap:8px;column-gap:18px;align-items:center;">
            <label class="record-label">Supplier Name</label>
            <div style="">
                <div class="customer-selector" style="position:relative;margin-bottom:4px;">
                        <input id="customer-search" type="text" placeholder="Click to search suppliers" autocomplete="off" style="width:100%;height:32px;border-radius:6px;border:1px solid #ccc;padding-right:140px;box-sizing:border-box;padding-left:8px;" />
                    <button type="button" id="customer-suggest-toggle" aria-label="Show suggestions" onclick="try{ window.toggleCustomerSuggestions(); }catch(e){ console.error(e); }" style="position:absolute;right:56px;top:50%;transform:translateY(-50%);height:32px;width:32px;border:0;background:transparent;cursor:pointer;font-size:16px;outline:none;padding:0;z-index:1600;">∨</button>
                    <button type="button" id="customer-search-btn" aria-label="Advanced search" onclick="try{ openCustomerModal((document.getElementById('customer-search')&&document.getElementById('customer-search').value)||''); }catch(e){ console.error(e); }" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);height:32px;padding:6px 8px;border-radius:6px;background:#1976d2;color:#fff;border:none;z-index:1600;">🔍</button>
                </div>
                <input type="hidden" id="selected_client_id" name="supplier_id" value="" />
                <select id="client-select" style="display:none;width:100%;height:36px;padding:6px;border-radius:6px;border:1px solid #ccc;">
                    <option value="">-- Select supplier --</option>
                    {% for s in suppliers %}
                    <option value="{{ s.id }}">{{ s.name }}{% if s.phone %} - {{ s.phone }}{% endif %}</option>
                    {% endfor %}
                </select>
                            <!-- full-select fallback removed per UX: only inline suggestions should appear -->
                <div id="customer-suggestions" style="position:relative;display:none;"></div>
            </div>

            <label class="record-label">Amount Received</label>
            <div>
                <input id="amount-received" type="number" step="0.001" min="0" placeholder="0.000" style="padding:8px;border-radius:6px;border:1px solid #ccc;text-align:left;width:200px;" />
            </div>

            <label class="record-label">Payment Date</label>
            <div>
                <input id="payment-date" type="date" value="{% now 'Y-m-d' %}" style="padding:8px;border-radius:6px;border:1px solid #ccc;width:200px;" />
            </div>

            <label class="record-label">Payment #</label>
            <div>
                <input id="payment-ref" name="reference" type="text" placeholder="Reference #" value="{{ next_payment_ref|default:'' }}" style="padding:8px;border-radius:6px;border:1px solid #ccc;width:200px;" />
            </div>

            <label class="record-label">Method</label>
            <div>
                <select id="payment-method" style="padding:8px;border-radius:6px;border:1px solid #ccc;width:200px;">
                    <option value="cash">Cash</option>
                    <option value="card">Credit Card</option>
                    <option value="benefit">Benefitpay</option>
                    <option value="bank">Bank Transfer</option>
                    <option value="other">Other</option>
                </select>
            </div>
        </div>
    </div>

    <div style="margin-top:8px;margin-bottom:12px;">
        <table id="invoices-table" style="width:100%;border-collapse:collapse;border:1px solid #e6e6e6;">
            <thead style="background:#f8fafc;font-weight:700;color:#333;">
                <tr>
                    <th style="padding:10px;border-bottom:1px solid #e6e6e6;text-align:left;">Date</th>
                    <th style="padding:10px;border-bottom:1px solid #e6e6e6;text-align:left;">Bill Number</th>
                    <th style="padding:10px;border-bottom:1px solid #e6e6e6;text-align:right;">Bill Amount</th>
                    <th style="padding:10px;border-bottom:1px solid #e6e6e6;text-align:right;">Amount Due</th>
                    <th style="padding:10px;border-bottom:1px solid #e6e6e6;text-align:right;">Payment</th>
                </tr>
            </thead>
            <tbody>
                <tr id="no-invoices-row"><td colspan="5" style="padding:18px;text-align:center;color:#666;">Select a supplier to load bills.</td></tr>
            </tbody>
        </table>
    </div>

    <button type="button" id="hidden-save-draft" name="action" value="save_draft" style="display:none"></button>
    <button type="button" id="hidden-save-send" name="action" value="save_send" style="display:none"></button>

    <div id="bottom-action-bar" style="position:fixed;left:0;right:0;bottom:0;background:linear-gradient(90deg, #fff, #fff);border-top:1px solid #e6e6e6;padding:10px 18px;">
        <div style="max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;">
                <div style="display:flex;gap:8px;align-items:center;">
                <button type="button" id="btn-draft" class="btn" style="background:#fff;border:1px solid #d1d5db;padding:8px 12px;border-radius:6px;">Save as Draft</button>
                <button type="button" id="btn-save" class="btn btn-primary" style="padding:8px 14px;background:linear-gradient(90deg,#1976d2 60%,#2196f3 100%);color:#fff;border-radius:6px;border:none;">Save and Send</button>
                <button type="button" id="btn-cancel" class="btn" style="background:#fff;border:1px solid #d1d5db;padding:8px 12px;border-radius:6px;color:#1976d2;">Cancel</button>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
                <div style="color:#6b7280;font-size:13px;">Make Recurring</div>
                <div style="background:#f3f4f6;border-radius:6px;padding:8px 10px;font-weight:600;">Total Amount: <span id="bottom-total">BHD 0.000</span></div>
            </div>
        </div>
    </div>
</div>

<script>
// preload minimal suppliers sample for inline suggestions
window.clients_sample = [
    {% for s in suppliers %}
    { id: {{ s.id }}, name: "{{ s.name }}", phone: "{{ s.phone|default:'' }}" }{% if not forloop.last %},{% endif %}
    {% endfor %}
];

document.addEventListener('DOMContentLoaded', function(){
    // CSRF helper
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    const csrftoken = getCookie('csrftoken');
    const clientSelect = document.getElementById('client-select');
    const clientSearch = document.getElementById('customer-search');
    const tableBody = document.querySelector('#invoices-table tbody');

    // Debug helpers: ensure supplier search input and buttons respond to clicks
    console.log('vendor_payments_add.js initializing', {clientSearch: !!clientSearch, clientSelect: !!clientSelect});
    // Attach verbose debug click logging and enforce pointer events/z-index
    ['customer-search','customer-suggest-toggle','customer-search-btn','client-select'].forEach(function(id){
        try{
            var el = document.getElementById(id);
            if(!el){ console.log('debug: element not found', id); return; }
            console.log('debug: attach listener to', id, el);
            try{ el.style.pointerEvents = 'auto'; el.style.zIndex = el.style.zIndex || 2000; }catch(e){}
            el.addEventListener('click', function(ev){ console.log('debug: clicked', id, ev.target); });
        }catch(e){ console.error('debug attach failed', id, e); }
    });
    function __openInlineSuggestions(){ try{ if(typeof showInlineCustSuggestions === 'function'){ showInlineCustSuggestions(''); } else { console.log('showInlineCustSuggestions not ready yet'); } }catch(e){ console.error('openInlineSuggestions failed', e); } }
    // attach a basic click handler immediately so clicks work even if other wiring fails
    try{ if(clientSearch){ clientSearch.addEventListener('click', __openInlineSuggestions); clientSearch.addEventListener('focus', __openInlineSuggestions); } }catch(e){ console.error(e); }
    try{ var __custBtnInit = document.getElementById('customer-search-btn'); if(__custBtnInit){ __custBtnInit.addEventListener('click', function(e){ e.preventDefault(); __openInlineSuggestions(); openCustomerModal(clientSearch && clientSearch.value ? clientSearch.value : ''); }); } }catch(e){ console.error(e); }

    function format(n){ return parseFloat(n||0).toFixed(3); }

    function recalc(){
        let total = 0; let received = 0; let used = 0; let refunded = 0; let excess = 0;
        const rows = Array.from(tableBody.querySelectorAll('tr.invoice-row'));
        rows.forEach(r => {
            const amt = parseFloat(r.dataset.amount) || 0;
            const rem = parseFloat(r.dataset.remaining) || 0;
            const payInput = r.querySelector('.pay-input');
            const payVal = parseFloat(payInput.value) || 0;
            total += amt;
            used += Math.min(payVal, rem);
            received += payVal;
            if(payVal < 0) refunded += Math.abs(payVal);
            if(payVal > rem) excess += (payVal - rem);
        });
        const bottom = document.getElementById('bottom-total');
        if(bottom) bottom.textContent = format(received);
    }

    function makeRow(inv){
        const tr = document.createElement('tr');
        tr.className = 'invoice-row';
        tr.dataset.invoiceId = inv.id;
        tr.dataset.amount = inv.amount;
        tr.dataset.remaining = inv.remaining;
        tr.innerHTML = `
            <td style="padding:10px;border-bottom:1px solid #eee;">${inv.date}</td>
            <td style="padding:10px;border-bottom:1px solid #eee;">${inv.invoice_number || inv.bill_number}</td>
            <td style="padding:10px;border-bottom:1px solid #eee;text-align:right;">${parseFloat(inv.amount).toFixed(3)}</td>
            <td style="padding:10px;border-bottom:1px solid #eee;text-align:right;">${parseFloat(inv.remaining).toFixed(3)}</td>
            <td style="padding:10px;border-bottom:1px solid #eee;text-align:right;"><input type="number" step="0.001" min="0" class="pay-input" style="width:110px;padding:6px;border-radius:6px;border:1px solid #ddd;text-align:right;" value="0.000" /></td>
        `;
        tableBody.appendChild(tr);
        const input = tr.querySelector('.pay-input');
        input.addEventListener('input', function(){ recalc(); });
    }

    function distributePayment(amount){
        let remaining = parseFloat(amount) || 0;
        const rows = Array.from(tableBody.querySelectorAll('tr.invoice-row'));
        rows.sort(function(a,b){ try{ return new Date(a.dataset.date) - new Date(b.dataset.date); }catch(e){ return 0; } });
        rows.forEach(function(r){
            const rem = parseFloat(r.dataset.remaining) || 0;
            const input = r.querySelector('.pay-input');
            if(!input) return;
            if(remaining <= 0){ input.value = '0.000'; return; }
            const apply = Math.min(rem, remaining);
            input.value = apply.toFixed(3);
            remaining = Math.max(0, remaining - apply);
        });
        recalc();
    }

    clientSelect.addEventListener('change', function(){
        const cid = clientSelect.value;
        tableBody.innerHTML = '';
        if(!cid){
            const r = document.createElement('tr'); r.id='no-invoices-row'; r.innerHTML = '<td colspan="6" style="padding:18px;text-align:center;color:#666;">Select a supplier to load bills.</td>';
            tableBody.appendChild(r);
            recalc();
            return;
        }
        var url = '/bills/supplier-bills/?id=' + encodeURIComponent(cid);
        fetch(url, {headers: {'X-Requested-With': 'XMLHttpRequest'}})
            .then(function(r){
                if(!r.ok){ return r.text().then(function(t){ throw t || ('HTTP ' + r.status); }); }
                var ct = r.headers.get('content-type') || '';
                if(!ct.toLowerCase().includes('application/json')){ return r.text().then(function(t){ throw t || 'Invalid response'; }); }
                return r.json();
            })
            .then(function(data){
                // only show bills that have a positive remaining amount
                try{
                    var list = Array.isArray(data) ? data : [];
                    var filtered = list.filter(function(inv){ return parseFloat(inv.remaining) > 0; });
                    if(!filtered || filtered.length === 0){
                        const r = document.createElement('tr'); r.id='no-invoices-row'; r.innerHTML = '<td colspan="5" style="padding:18px;text-align:center;color:#666;">No bills found for this supplier.</td>';
                        tableBody.appendChild(r);
                    } else {
                        filtered.forEach(function(inv){ makeRow(inv); var last = tableBody.querySelector('tr.invoice-row:last-child'); if(last) last.dataset.date = inv.date || ''; });
                    }
                }catch(e){
                    tableBody.innerHTML = '<tr id="no-invoices-row"><td colspan="5" style="padding:18px;text-align:center;color:#666;">No bills found for this supplier.</td></tr>';
                }
                recalc();
            }).catch(function(err){
                var msg = typeof err === 'string' ? err : (err && err.message) ? err.message : 'Failed to load bills.';
                tableBody.innerHTML = '<tr id="no-invoices-row"><td colspan="5" style="padding:18px;text-align:center;color:#666;">' + (msg || 'Failed to load bills.') + '</td></tr>';
            });
    });

    // Note: full-select fallback removed — supplier selection is via inline suggestions only.

    // inline supplier suggestions reuse clients_sample variable
    var custInput = document.getElementById('customer-search');
    var custSuggestions = document.getElementById('customer-suggestions');
    function clearCustSuggestions(){
        try{
            // remove any suggestion boxes created by this UI (search globally for our marker)
            var boxes = Array.from(document.querySelectorAll('[data-vendor-suggestions="1"]'));
            boxes.forEach(function(el){ try{ if(el._cleanup && typeof el._cleanup === 'function') el._cleanup(); }catch(e){} if(el && el.parentNode) el.parentNode.removeChild(el); });
            if(custSuggestions){ custSuggestions.innerHTML=''; custSuggestions.style.display='none'; }
        }catch(e){}
        var t = document.getElementById('customer-suggest-toggle'); if(t) t.textContent='∨';
    }
    function renderCustSuggestions(list){
        try{
            clearCustSuggestions();
            if(!list || !list.length) return;
            var container = (custInput && custInput.parentNode) || custSuggestions || document.body;
            if(!container) return;
            try{ container.style.position = container.style.position || 'relative'; }catch(e){}
            var box = document.createElement('div');
            box.setAttribute('role','listbox');
            box.setAttribute('data-vendor-suggestions','1');
            box.style.position='absolute'; box.style.zIndex=1500; box.style.background='#fff'; box.style.border='1px solid #e6e6e6'; box.style.borderRadius='6px'; box.style.direction='ltr'; box.style.boxSizing='border-box'; box.style.overflow='auto'; box.style.maxHeight='360px';

            var rowsContainer = document.createElement('div'); rowsContainer.style.maxHeight = '300px'; rowsContainer.style.overflow = 'auto';
            var localSearch = document.createElement('input'); localSearch.type = 'search'; localSearch.placeholder = 'Search suppliers'; localSearch.style.width = '100%'; localSearch.style.boxSizing = 'border-box'; localSearch.style.padding = '8px'; localSearch.style.border = '0'; localSearch.style.borderBottom = '1px solid #eef2f7';

            function buildRows(displayList){ rowsContainer.innerHTML = ''; (displayList || []).slice(0,200).forEach(function(item){ var row = document.createElement('div'); row.style.padding='8px'; row.style.cursor='pointer'; row.style.borderBottom='1px solid #f1f5f9'; var nameDiv = document.createElement('div'); nameDiv.style.fontWeight='600'; nameDiv.textContent = item.name || ''; var subDiv = document.createElement('div'); subDiv.className='small-muted'; subDiv.style.fontSize='13px'; subDiv.textContent = (item.phone||''); row.appendChild(nameDiv); row.appendChild(subDiv); row.addEventListener('click', function(e){ e.stopPropagation(); try{ selectCustomer(item); }catch(err){} }); rowsContainer.appendChild(row); }); }

            buildRows(list || []);
            localSearch.addEventListener('input', function(){ var q = (localSearch.value || '').trim().toLowerCase(); if(!q){ buildRows(list); return; } var filtered = (list || []).filter(function(it){ return (it.name||'').toLowerCase().indexOf(q) !== -1 || (it.phone||'').indexOf(q)!==-1; }); buildRows(filtered); });

            box.appendChild(localSearch); box.appendChild(rowsContainer); box.addEventListener('click', function(ev){ ev.stopPropagation(); });
            function positionBox(){ try{ var left = custInput.offsetLeft + 'px'; var top = (custInput.offsetTop + custInput.offsetHeight) + 'px'; box.style.left = left; box.style.top = top; box.style.width = custInput.offsetWidth + 'px'; }catch(e){} }
            positionBox(); var onWindowChange = function(){ positionBox(); };
            box._cleanup = function(){ try{ window.removeEventListener('resize', onWindowChange); window.removeEventListener('scroll', onWindowChange, true); }catch(e){} };
            window.addEventListener('resize', onWindowChange); window.addEventListener('scroll', onWindowChange, true);

            container.appendChild(box); try{ custSuggestions.style.display='block'; }catch(e){}
            var t = document.getElementById('customer-suggest-toggle'); if(t) t.textContent='∧';
        }catch(err){ console.error('renderCustSuggestions', err); }
    }
    function showInlineCustSuggestions(q){ q = (q||'').trim(); if(window.clients_sample && window.clients_sample.length){ if(!q) renderCustSuggestions(window.clients_sample.slice(0,200)); else { var filtered = window.clients_sample.filter(function(it){ return (it.name||'').toLowerCase().indexOf(q.toLowerCase())!==-1 || (it.phone||'').indexOf(q)!==-1; }); renderCustSuggestions(filtered); } return; } fetch('/suppliers/search/?q='+encodeURIComponent(q)).then(r=>r.json()).then(data=> renderCustSuggestions(data.results||[])).catch(()=>{});
    }
    function selectCustomer(item){ try{ document.getElementById('selected_client_id').value = item.id; }catch(e){} try{ if(custInput) custInput.value = item.name || ''; }catch(e){} try{ clientSelect.value = item.id; clientSelect.dispatchEvent(new Event('change')); }catch(e){} clearCustSuggestions(); }

    var custToggle = document.getElementById('customer-suggest-toggle');
    if (custToggle && custInput) {
        custToggle.addEventListener('click', function (e) {
            e.preventDefault(); e.stopPropagation();
            try{
                var parent = custInput.parentNode;
                // check for any suggestion box appended under parent or globally (robust)
                var existing = (parent && parent.querySelector && parent.querySelector('[role="listbox"]')) || document.querySelector('[data-vendor-suggestions="1"]') || document.querySelector('[role="listbox"]');
                if (existing) {
                    clearCustSuggestions();
                    custToggle.textContent = '∨';
                } else {
                    showInlineCustSuggestions('');
                    custToggle.textContent = '∧';
                }
            }catch(err){ console.error('custToggle click', err); }
        });
    }
    var custBtn = document.getElementById('customer-search-btn'); if(custBtn){ custBtn.addEventListener('click', function(){ var q = (custInput && custInput.value) ? custInput.value : ''; openCustomerModal(q); }); }

    if(custInput){ custInput.addEventListener('focus', function(){ try{ showInlineCustSuggestions(''); }catch(err){} }); custInput.addEventListener('click', function(e){ try{ showInlineCustSuggestions(''); }catch(err){} }); custInput.addEventListener('input', function(e){ try{ showInlineCustSuggestions(custInput.value || ''); }catch(err){} }); document.addEventListener('click', function(e){ try{ if(e.target && e.target.closest && (e.target.closest('#customer-suggestions') || e.target.closest('.customer-selector'))) return; }catch(err){} try{ clearCustSuggestions(); }catch(err){} }); }

    // Robust fallback listeners: ensure toggle arrow and magnifier always work
    try{
        (function(){
            var toggleBtn = document.getElementById('customer-suggest-toggle');
            var magBtn = document.getElementById('customer-search-btn');
            var inputEl = document.getElementById('customer-search');
            if(toggleBtn){
                toggleBtn.addEventListener('click', function(e){
                    e.preventDefault(); e.stopPropagation();
                    try{
                        var parent = inputEl && inputEl.parentNode;
                        var existing = parent && parent.querySelector('[role="listbox"]');
                        if(existing){ clearCustSuggestions(); toggleBtn.textContent = '∨'; }
                        else { showInlineCustSuggestions(''); toggleBtn.textContent = '∧'; }
                    }catch(err){ console.error('toggle fallback', err); }
                });
            }
            if(magBtn){
                magBtn.addEventListener('click', function(e){
                    e.preventDefault(); e.stopPropagation();
                    try{ openCustomerModal((inputEl&&inputEl.value)||''); }catch(err){ console.error('mag fallback', err); }
                });
            }
        })();
    }catch(e){ console.error('attach fallback listeners', e); }

    try {
        window.toggleCustomerSuggestions = function() {
            try {
                if (!custInput) return;
                var parent = custInput.parentNode;
                var existing = (parent && parent.querySelector && parent.querySelector('[role="listbox"]')) || document.querySelector('[data-vendor-suggestions="1"]') || document.querySelector('[role="listbox"]');
                var t = document.getElementById('customer-suggest-toggle');
                if (existing) {
                    try { clearCustSuggestions(); } catch (e) {}
                    try { if (t) t.textContent = '∨'; } catch (e) {}
                    return;
                }
                try { showInlineCustSuggestions(''); } catch (e) {}
                try { if (t) t.textContent = '∧'; } catch (e) {}
            } catch (e) {}
        }
    } catch (e) {}

    // expose helper functions for fallback onclicks (magnifier/caret use these)
    try{ window.showInlineCustSuggestions = showInlineCustSuggestions; window.openCustomerModal = openCustomerModal; window.clearCustSuggestions = clearCustSuggestions; }catch(e){}

    // Capture-phase document listener to reliably handle clicks on the caret and magnifier
    try{
        document.addEventListener('click', function(ev){
            try{
                var target = ev.target || ev.srcElement;
                if(target && target.closest){
                    if(target.closest && target.closest('#customer-suggest-toggle')){
                        // ensure we handle the caret toggle even if other handlers stopPropagation
                        console.log('debug(capture): caret clicked');
                        ev.preventDefault(); ev.stopPropagation();
                        var t = document.getElementById('customer-suggest-toggle');
                        try{ window.toggleCustomerSuggestions(); }catch(e){ console.error('toggleCustomerSuggestions missing', e); }
                        return;
                    }
                    if(target.closest && target.closest('#customer-search-btn')){
                        console.log('debug(capture): magnifier clicked');
                        ev.preventDefault(); ev.stopPropagation();
                        try{ window.openCustomerModal((document.getElementById('customer-search')&&document.getElementById('customer-search').value)||''); }catch(e){ console.error('openCustomerModal missing', e); }
                        return;
                    }
                }
            }catch(e){ console.error('capture handler', e); }
        }, true);
    }catch(e){ console.error('attach capture listener', e); }

    // Also attach direct capture listeners to the elements themselves (extra robustness)
    try{
        var __toggleEl = document.getElementById('customer-suggest-toggle');
        var __magEl = document.getElementById('customer-search-btn');
        if(__toggleEl){
            __toggleEl.addEventListener('click', function(ev){
                try{ console.log('debug(capture-direct): caret clicked'); ev.preventDefault(); ev.stopPropagation(); window.toggleCustomerSuggestions(); }catch(e){ console.error('direct toggle handler', e); }
            }, true);
        }
        if(__magEl){
            __magEl.addEventListener('click', function(ev){
                try{ console.log('debug(capture-direct): magnifier clicked'); ev.preventDefault(); ev.stopPropagation(); window.openCustomerModal((document.getElementById('customer-search')&&document.getElementById('customer-search').value)||''); }catch(e){ console.error('direct mag handler', e); }
            }, true);
        }
    }catch(e){ console.error('attach direct capture listeners', e); }

    function openCustomerModal(prefill){
        var modal = document.createElement('div'); modal.style.position='fixed'; modal.style.left='0'; modal.style.top='0'; modal.style.right='0'; modal.style.bottom='0'; modal.style.background='rgba(0,0,0,0.5)'; modal.style.display='flex'; modal.style.alignItems='center'; modal.style.justifyContent='center'; modal.style.zIndex=1300;
        var card = document.createElement('div'); card.style.background='#fff'; card.style.padding='12px'; card.style.borderRadius='8px'; card.style.maxWidth='820px'; card.style.width='96%';
        var header = document.createElement('div'); header.style.display='flex'; header.style.justifyContent='space-between'; header.style.marginBottom='12px'; header.innerHTML = '<h3 style="margin:0">Search Suppliers</h3><button style="border:0;background:transparent;font-size:18px;">✕</button>';
        card.appendChild(header);
        var body = document.createElement('div'); body.style.maxHeight='360px'; body.style.overflow='auto';
        var input = document.createElement('input'); input.type='search'; input.value = prefill || ''; input.placeholder='Search'; input.style.width='100%'; input.style.padding='8px'; input.style.marginBottom='8px'; input.style.border='1px solid #e6e6e6'; input.style.borderRadius='6px';
        var btn = document.createElement('button'); btn.className='btn'; btn.textContent='Search'; btn.style.marginLeft='8px'; btn.style.padding='8px';
        var top = document.createElement('div'); top.style.display='flex'; top.appendChild(input); top.appendChild(btn);
        card.appendChild(top); card.appendChild(body); modal.appendChild(card); document.body.appendChild(modal);
        function closeModal(){ try{ document.body.removeChild(modal); }catch(e){} try{ document.removeEventListener('keydown', __esc); }catch(e){} }
        header.querySelector('button').addEventListener('click', closeModal);

        // debounce helper
        function debounce(fn, wait){ var t=null; return function(){ var args=arguments; var ctx=this; if(t) clearTimeout(t); t=setTimeout(function(){ fn.apply(ctx,args); }, wait||250); }; }

        var __doSearch = function(q){ body.innerHTML = '<div style="padding:12px;color:#666">Searching...</div>'; fetch('/suppliers/search/?q='+encodeURIComponent(q)).then(r=>r.json()).then(data=>{ renderModalResults(data.results||[]); }).catch(()=>{ body.innerHTML = '<div style="padding:12px;color:#c00">Search failed</div>'; }); };

        var debouncedSearch = debounce(function(){ __doSearch(input.value || ''); }, 180);

        btn.addEventListener('click', function(){ __doSearch(input.value || ''); });
        input.addEventListener('input', function(){ if(!(input.value||'').trim()){ body.innerHTML = '<div style="padding:12px;color:#666">Type to search</div>'; return; } debouncedSearch(); });

        // close when clicking outside the card
        modal.addEventListener('click', function(ev){ if(ev.target === modal){ closeModal(); } });

        // close on Escape
        var __esc = function(ev){ if(ev.key === 'Escape'){ closeModal(); } };
        document.addEventListener('keydown', __esc);
        function renderModalResults(list){
            body.innerHTML = '';
            if(!list || !list.length){ body.innerHTML = '<div style="padding:12px;color:#666">No results</div>'; return; }

            var container = document.createElement('div');
            container.style.maxHeight = '360px';
            container.style.overflow = 'auto';
            container.style.border = '1px solid #e6e6e6';
            container.style.borderRadius = '6px';

            var tbl = document.createElement('table'); tbl.style.width = '100%'; tbl.style.borderCollapse = 'collapse';
            var thead = document.createElement('thead');
            thead.style.position = 'sticky'; thead.style.top = '0'; thead.style.background = '#fff'; thead.style.zIndex = '10';
            thead.innerHTML = '<tr>' +
                '<th style="text-align:left;padding:8px;border-bottom:1px solid #eee">CUSTOMER NAME</th>' +
                '<th style="text-align:left;padding:8px;border-bottom:1px solid #eee">PHONE</th>' +
                '<th style="text-align:left;padding:8px;border-bottom:1px solid #eee">PLATES</th>' +
                '<th style="text-align:left;padding:8px;border-bottom:1px solid #eee">MODEL</th>' +
                '</tr>';
            tbl.appendChild(thead);

            var tbody = document.createElement('tbody');
            list.forEach(function(it){
                var tr = document.createElement('tr'); tr.style.cursor = 'pointer'; tr.style.borderBottom = '1px solid #f1f5f9';
                tr.addEventListener('mouseover', function(){ tr.style.background = '#f8fafc'; });
                tr.addEventListener('mouseout', function(){ tr.style.background = ''; });

                var nameTd = document.createElement('td'); nameTd.style.padding='8px'; nameTd.style.fontWeight='600'; nameTd.textContent = it.name || '';
                var phoneTd = document.createElement('td'); phoneTd.style.padding='8px'; phoneTd.textContent = it.phone || '';
                var platesTd = document.createElement('td'); platesTd.style.padding='8px'; platesTd.textContent = (it.plates && it.plates.length)? it.plates.join(', ') : '';
                var modelTd = document.createElement('td'); modelTd.style.padding='8px'; var modelLabel=''; if(it.cars && it.cars.length){ var c0 = it.cars[0]; var br = (c0.brand && (c0.brand.name || c0.brand)) || c0.brand || ''; var mo = (c0.model && (c0.model.name || c0.model)) || c0.model || ''; var yr = c0.year || c0.year===0 ? String(c0.year) : ''; var parts = []; if(br) parts.push(String(br).toUpperCase()); if(mo) parts.push(String(mo).toUpperCase()); if(yr) parts.push(String(yr)); modelLabel = parts.join(' - '); } modelTd.textContent = modelLabel;

                tr.addEventListener('click', function(){ try{ selectCustomer(it); }catch(e){} closeModal(); });
                tr.appendChild(nameTd); tr.appendChild(phoneTd); tr.appendChild(platesTd); tr.appendChild(modelTd);
                tbody.appendChild(tr);
            });

            tbl.appendChild(tbody); container.appendChild(tbl); body.appendChild(container);
        }
    }

    if (clientSearch) {
        clientSearch.addEventListener('input', function(){
            const q = (clientSearch.value || '').trim().toLowerCase();
            const opts = Array.from(clientSelect.options || []);
            let firstVisible = null;
            opts.forEach(function(opt, idx){
                if (!opt.value) { opt.hidden = false; return; }
                const txt = (opt.textContent || opt.innerText || '').toLowerCase();
                const matches = q === '' || txt.indexOf(q) !== -1;
                opt.hidden = !matches;
                if (matches && !firstVisible) firstVisible = opt;
            });
            if (firstVisible) {
                if (q !== '') {
                    clientSelect.value = firstVisible.value;
                    clientSelect.dispatchEvent(new Event('change'));
                }
                clientSelect.focus();
            }
        });

        clientSearch.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); const opts = Array.from(clientSelect.options || []); const first = opts.find(o => o.value && !o.hidden); if (first) { clientSelect.value = first.value; clientSelect.dispatchEvent(new Event('change')); } } });
    }

    const amountReceivedInput = document.getElementById('amount-received');
    if(amountReceivedInput){ amountReceivedInput.addEventListener('input', function(){ const v = parseFloat(amountReceivedInput.value) || 0; distributePayment(v); }); }

    document.getElementById('btn-save').addEventListener('click', function(){
        const cid = clientSelect.value;
        if(!cid){ alert('يرجى اختيار المورد'); return; }
        const allocations = [];
        const rows = Array.from(tableBody.querySelectorAll('tr.invoice-row'));
        rows.forEach(r => {
            const id = r.dataset.invoiceId;
            const input = r.querySelector('.pay-input');
            const val = parseFloat(input.value) || 0;
            if(val > 0) allocations.push({bill_id: id, amount: val});
        });
        if(allocations.length === 0){ if(!confirm('No amounts entered. Continue?')) return; }
        const payload = new FormData();
        payload.append('supplier_id', cid);
        payload.append('payment_date', document.getElementById('payment-date').value);
        payload.append('method', document.getElementById('payment-method').value);
        payload.append('reference', document.getElementById('payment-ref').value);
        payload.append('notes', '');
        payload.append('allocations', JSON.stringify(allocations));
        fetch('/bills/payments/add/', {method:'POST', body: payload, headers: {'X-Requested-With':'XMLHttpRequest', 'X-CSRFToken': csrftoken}})
            .then(r => { if(!r.ok) return r.text().then(t => Promise.reject(t)); return r.json(); }).then(data => { alert('Payments recorded.'); window.location.href = '/vendors/payments/'; }).catch(err => { alert('Failed to save payments: ' + err); });
    });

    document.getElementById('btn-draft').addEventListener('click', function(){
        const cid = clientSelect.value;
        if(!cid){ alert('يرجى اختيار المورد'); return; }
        const allocations = [];
        const rows = Array.from(tableBody.querySelectorAll('tr.invoice-row'));
        rows.forEach(r => {
            const id = r.dataset.invoiceId;
            const input = r.querySelector('.pay-input');
            const val = parseFloat(input.value) || 0;
            if(val > 0) allocations.push({bill_id: id, amount: val});
        });
        const payload = new FormData();
        payload.append('supplier_id', cid);
        payload.append('payment_date', document.getElementById('payment-date').value);
        payload.append('method', document.getElementById('payment-method').value);
        payload.append('reference', document.getElementById('payment-ref').value);
        payload.append('notes', '');
        payload.append('allocations', JSON.stringify(allocations));
        payload.append('draft', '1');
        fetch('/bills/payments/add/', {method:'POST', body: payload, headers: {'X-Requested-With':'XMLHttpRequest', 'X-CSRFToken': csrftoken}})
            .then(r => { if(!r.ok) return r.text().then(t => Promise.reject(t)); return r.json(); }).then(data => { alert('Draft saved.'); window.location.href = '/vendors/payments/'; }).catch(err => { alert('Failed to save draft: ' + err); });
    });

    document.getElementById('btn-cancel').addEventListener('click', function(){ window.location.href = '/vendors/payments/'; });

});
</script>

{% endblock %}
