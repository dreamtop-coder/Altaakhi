{% extends "base.html" %}
{% block content %}
<div class="invoice-page invoice-card">
  <h2>إضافة فاتورة بيع</h2>

  <style>
    /* Match maintenance item row styling */
    #items-table th, #items-table td { padding:8px 12px; text-align:left; vertical-align:middle; }
    #items-table .item-desc, #items-table .service-label {
        width:100% !important;
        padding:6px !important;
        border:1px solid #ddd !important;
        border-radius:6px !important;
        font-size:14px !important;
        color:#374151 !important;
        font-weight:400 !important;
        box-sizing:border-box !important;
        min-height:36px !important;
        height:36px !important;
        line-height:20px !important;
        background:#fff !important;
        display:block !important;
    }
    #items-table input[type="number"]{
        padding:6px !important;
        border:1px solid #eee !important;
        border-radius:6px !important;
        box-sizing:border-box !important;
        text-align:center !important;
        height:36px !important;
    }
    #items-table input.item-amount{
        padding:6px !important;
        border:1px solid #eee !important;
        border-radius:6px !important;
        box-sizing:border-box !important;
        text-align:right !important;
        background:#fafafa !important;
        height:36px !important;
    }
    #items-table input.item-qty { width:90px !important; }
    #items-table input.item-rate { width:110px !important; }
    #items-table input.item-discount { width:60px !important; }
    #items-table input.item-amount { width:calc(100% - 12px) !important; }
    /* Align Quantity input to left for the first (pre-rendered) row to match JS-created rows */
    #items-table tbody .item-row:first-child input.item-qty { text-align: left !important; }
  </style>

  <!-- Customer header -->
  <section id="invoice-header">
    <label>العميل</label>
    <input id="customer-search" name="customer_search" placeholder="ابحث عن عميل" autocomplete="off" />
    <button id="customer-search-btn" type="button">🔍</button>
  </section>

  <!-- Parts table only (no services) -->
  <section class="parts-section">
    <h3>قطع الغيار</h3>
    <table id="items-table">
      <thead>
        <tr><th>الوصف</th><th>كمية</th><th>سعر</th><th>خصم</th><th>المبلغ</th><th></th></tr>
      </thead>
      <tbody id="items-body"></tbody>
    </table>
    <button id="add-row" type="button">إضافة قطعة</button>
  </section>

  <!-- Totals -->
  <section class="totals">
    <div>Sub total: <span id="sub-total">0.000</span></div>
    <div>Discount: <span id="total-discount">0.000</span></div>
    <div>Grand: <span id="grand-total">0.000</span></div>
  </section>

  <form id="invoice-form" method="post">
    {% csrf_token %}
    <input type="hidden" id="items_json" name="items_json" />
    <button type="submit">حفظ الفاتورة</button>
  </form>
</div>

<!-- Scripts: core + invoice-only logic (no services) -->
<script>window.PAGE_MODE = 'invoice';</script>
<script src="{% static 'js/core-inventory.js' %}"></script>
<script src="{% static 'js/invoice.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', function(){ try{ document.body.dataset.page = 'invoices'; }catch(e){} });
</script>
<script>
// Defensive binding: ensure add-row always creates a new JS row even if other scripts fail
document.addEventListener('DOMContentLoaded', function(){
  try{
    var btn = document.getElementById('add-row');
    if(!btn) return;
    if(btn.dataset && btn.dataset.addlineBound) return;
    btn.addEventListener('click', function(e){ e && e.preventDefault(); try{ if(window.createItemRow) window.createItemRow(true); else console.error('createItemRow not available'); }catch(err){ console.error('add-row handler error', err); } });
    try{ btn.dataset.addlineBound = '1'; }catch(e){}
  }catch(e){ console.error('failed to bind add-row', e); }
});
</script>
{% endblock %}
