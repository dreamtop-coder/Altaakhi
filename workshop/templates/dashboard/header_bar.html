<div id="dashboard-header-toggle" style="margin: 2rem 0 1rem 0; text-align: center;">
    <button id="toggle-header-btn" style="font-size: 1.2rem; display: inline-block;">&gt;</button>
    <div id="dashboard-header-bar" style="display: block; margin-top: 1rem;">
        <div style="display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center;">
            <button class="header-filter-btn" data-status="waiting">Waiting</button>
            <button class="header-filter-btn" data-status="in_progress">In progress</button>
            <button class="header-filter-btn" data-status="ready">Ready for pickup</button>
            <button class="header-filter-btn" data-status="done">Completed</button>
            <button class="header-filter-btn" data-status="follow">Follow-up</button>
            <button class="header-filter-btn" data-status="pending_payment">Pending payment</button>
            <!-- تم حذف زر حجز -->
        </div>
        <div id="dashboard-header-search" style="margin-top: 1rem; display: none;">
            <input id="dashboard-search-input" type="text" placeholder="Search..." style="padding: 0.5rem; width: 250px;">
        </div>
    </div>
</div>
<script>
    const toggleBtn = document.getElementById('toggle-header-btn');
    const headerBar = document.getElementById('dashboard-header-bar');
    let headerVisible = true;
    toggleBtn.onclick = function() {
        if (headerBar.style.display === 'block') {
            headerBar.style.display = 'none';
            toggleBtn.innerHTML = '&lt;';
        } else {
            headerBar.style.display = 'block';
            toggleBtn.innerHTML = '&gt;';
        }
    };
    // إظهار شريط البحث عند الضغط على أي فلتر
    document.querySelectorAll('.header-filter-btn').forEach(btn => {
        btn.onclick = function() {
            document.getElementById('dashboard-header-search').style.display = 'block';
        };
    });

    // إرسال البحث بالضغط على Enter: يوجّه إلى صفحة العملاء مع باراميتر `search`
    var searchInput = document.getElementById('dashboard-search-input');
    if(searchInput){
        searchInput.addEventListener('keydown', function(e){
            if(e.key === 'Enter'){
                var q = (this.value || '').trim();
                if(q.length === 0) return;
                var url = '/clients/?search=' + encodeURIComponent(q);
                window.location.href = url;
            }
        });
    }
</script>
