{% extends 'base.html' %}
{% block content %}
<div style="height:28px;"></div>
<h2 style="margin-bottom:18px;">{% if edit %}Edit booking{% else %}Add booking{% endif %}</h2>
<form method="post" dir="ltr" class="booking-form-right" style="max-width:500px;background:#f9f9f9;padding:24px 10px 18px 10px;border-radius:10px;box-shadow:0 2px 8px #0001; text-align:left;">
    {% csrf_token %}
    <div style="margin-bottom:16px;">
        <label for="id_plate_number" style="display:block;font-weight:bold;margin-bottom:4px;">Plate <span style="color:#888;font-size:0.95em;">(required)</span></label>
        {{ form.plate_number }}
    </div>
    <div id="car-client-info"></div>
    <div style="margin-bottom:16px;">
        <label for="id_service_type" style="display:block;font-weight:bold;margin-bottom:4px;">Service type <span style="color:#888;font-size:0.95em;">(required)</span></label>
        {{ form.service_type }}
    </div>
    <div style="margin-bottom:16px;">
        <label for="id_service_date" style="display:block;font-weight:bold;margin-bottom:4px;">Service date <span style="color:#888;font-size:0.95em;">(required)</span></label>
        {{ form.service_date }}
    </div>
    <div style="margin-bottom:16px;">
        <label for="id_notes" style="display:block;font-weight:bold;margin-bottom:4px;">Notes <span style="color:#888;font-size:0.95em;">(optional)</span></label>
        {{ form.notes }}
    </div>
    <button type="submit" style="margin-top:16px;background:#007bff;color:#fff;padding:14px 0;width:100%;border-radius:8px;font-weight:bold;border:none;font-size:1.15em;">Save</button>
    {% if message %}
        <div style="color:red;margin-top:10px;">{{ message }}</div>
    {% endif %}
</form>
<a href="{% url 'bookings_list' %}" style="display:inline-block;margin-top:20px;">&larr; Back to bookings list</a>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var plateInput = document.getElementById('id_plate_number');
    var infoDiv = document.getElementById('car-client-info');
    function fetchCarInfo() {
        var plate = plateInput.value.trim();
        if (plate.length === 0) {
            infoDiv.innerHTML = '';
            return;
        }
        window.fetchJson('/bookings/car-info/?plate_number=' + encodeURIComponent(plate))
            .then(data => {
                if (data.error) {
                        infoDiv.innerHTML = '<div style="color:red;">' + data.error + '</div>';
                    } else {
                        var html = '<div style="background:#f3f7fa;padding:10px 12px;border-radius:7px;margin-bottom:14px;border:1px solid #e0e0e0;">';
                        html += '<b>Plate:</b> ' + (data.car_info.plate_number || '-') + '<br>';
                        if (data.client_info) {
                            html += '<b>Vehicle owner</b><br>';
                            html += 'Name: ' + (data.client_info.name || '-') + '<br>';
                            html += 'National ID: ' + (data.client_info.national_id || '-') + '<br>';
                            html += 'Phone: ' + (data.client_info.phone || '-') + '<br>';
                            html += 'Email: ' + (data.client_info.email || '-') + '<br>';
                            html += 'Address: ' + (data.client_info.address || '-') + '<br>';
                        }
                        html += '<b>Vehicle info</b><br>';
                        html += 'Status: ' + (data.car_info.status || '-') + '<br>';
                        html += 'Model: ' + (data.car_info.model || '-') + '<br>';
                        html += 'Brand: ' + (data.car_info.brand || '-') + '<br>';
                        html += 'Year: ' + (data.car_info.year || '-') + '<br>';
                        html += 'Added at: ' + (data.car_info.created_at || '-') + '<br>';
                        html += '</div>';
                        infoDiv.innerHTML = html;
                    }
            })
            .catch(() => {
                infoDiv.innerHTML = '<div style="color:red;">Unable to fetch car data.</div>';
            });
    }
    plateInput.addEventListener('input', fetchCarInfo);
    plateInput.addEventListener('change', fetchCarInfo);
    // enforce LTR and English placeholders on inputs
    try {
        plateInput.dir = 'ltr';
        plateInput.style.textAlign = 'left';
        plateInput.placeholder = plateInput.placeholder && plateInput.placeholder.trim() !== '' ? plateInput.placeholder : 'Enter plate number';
        var svc = document.getElementById('id_service_type');
        if (svc) { svc.dir = 'ltr'; svc.style.textAlign = 'left'; }
        var svcDate = document.getElementById('id_service_date');
        if (svcDate) { svcDate.dir = 'ltr'; svcDate.style.textAlign = 'left'; svcDate.placeholder = svcDate.placeholder && svcDate.placeholder.trim() !== '' ? svcDate.placeholder : 'dd/mm/yyyy'; }
        var notes = document.getElementById('id_notes');
        if (notes) { notes.dir = 'ltr'; notes.style.textAlign = 'left'; notes.placeholder = notes.placeholder && notes.placeholder.trim() !== '' ? notes.placeholder : 'Notes (optional)'; }
    } catch (e) { console.error('Placeholder/dir adjustment failed', e); }
});
</script>
<style>
form.booking-form-right {
    margin-left: 0;
    margin-right: auto;
    margin-top: 0;
    margin-bottom: 0;
    direction: ltr;
    text-align: left;
}
form.booking-form-right input,
form.booking-form-right select,
form.booking-form-right textarea {
    width: 100%;
    padding: 14px 14px;
    border-radius: 7px;
    border: 1.5px solid #bbb;
    font-size: 1.1em;
    box-sizing: border-box;
    margin-bottom: 0;
}
@media (max-width:1024px) {
    form.booking-form-right {
        margin: auto;
    }
}
@media (max-width:600px) {
    form.booking-form-right {
        padding: 14px 2px 10px 2px !important;
        font-size: 0.98em;
        margin: auto;
    }
    h2 { font-size: 1.15em !important; }
    button[type="submit"] { font-size: 1em !important; padding: 10px 0 !important; }
    form.booking-form-right input,
    form.booking-form-right select,
    form.booking-form-right textarea {
        padding: 10px 8px;
        font-size: 1em;
    }
}
</style>
{% endblock %}
